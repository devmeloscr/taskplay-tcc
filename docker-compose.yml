services:
  db:
    image: postgres:17-alpine
    container_name: taskplay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskplay
      POSTGRES_PASSWORD: taskplay
      POSTGRES_DB: taskplay
    ports:
      # 5433 no host para nao colidir com o PostgreSQL 14 ja instalado
      # localmente, que ocupa a 5432.
      - '5433:5432'
    volumes:
      - taskplay-db-data:/var/lib/postgresql/data
    healthcheck:
      # Impede que a API tente conectar antes de o banco aceitar conexoes.
      test: ['CMD-SHELL', 'pg_isready -U taskplay -d taskplay']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: taskplay-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taskplay
      MINIO_ROOT_PASSWORD: taskplay-storage
    ports:
      # 9000: API S3. 9001: console web, util para conferir a retencao.
      - '9000:9000'
      - '9001:9001'
    volumes:
      - taskplay-storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskplay-db-data:
  taskplay-storage-data:
